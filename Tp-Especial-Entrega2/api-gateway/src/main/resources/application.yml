server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # GUI: CORS para que el navegador deje a la web (otro origen: localhost:5173 en desarrollo,
      # localhost:3000 en Docker) llamar al gateway. Se resuelve aca, una sola vez, antes de los filtros:
      # el preflight OPTIONS lo contesta el gateway, y las respuestas (incluso los 401) llevan los encabezados.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            # para que el front pueda leer estos encabezados de la respuesta
            exposedHeaders: X-Correlation-Id,X-Auth-Error
            maxAge: 3600
      routes:
        # 1. Rutas a usuarios-service (puerto 8081)
        - id: usuarios-service
          uri: ${USUARIOS_URL:http://localhost:8081}
          predicates:
            - Path=/usuarios/**

        # 2. Rutas a eventos-service (puerto 8082)
        - id: eventos-service
          uri: ${EVENTOS_URL:http://localhost:8082}
          predicates:
            - Path=/eventos/**

        # 3. Rutas a ventas-service (puerto 8083)
        - id: ventas-service
          uri: ${VENTAS_URL:http://localhost:8083}
          predicates:
            - Path=/compras/**, /entradas/**, /disponibilidad/**, /devoluciones/**, /ingresos/**, /reportes/**, /filas/**

        # 4. Rutas a lugares-service (puerto 8084)
        - id: lugares-service
          uri: ${LUGARES_URL:http://localhost:8084}
          predicates:
            - Path=/lugares/**, /sectores/**

        # 5. Rutas a preferencias-service (puerto 8086). /interno/** no se expone.
        - id: preferencias-service
          uri: ${PREFERENCIAS_URL:http://localhost:8086}
          predicates:
            - Path=/preferencias/**, /recomendaciones/**

        # 6. Rutas a notificaciones-service (puerto 8087). /interno/** no se expone.
        - id: notificaciones-service
          uri: ${NOTIFICACIONES_URL:http://localhost:8087}
          predicates:
            - Path=/notificaciones/**

# Entrega 2: MISMA clave que ms-usuarios. El gateway valida la firma del JWT.
jwt:
  secret: ${JWT_SECRET:clave-super-secreta-ticketya-2026-cambiar-en-produccion-min-32-bytes}

logging:
  level:
    gateway: INFO
    org.springframework.cloud.gateway: INFO
