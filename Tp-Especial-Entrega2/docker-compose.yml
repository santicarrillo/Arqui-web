# docker-compose GENERAL del sistema TicketYa (Entrega 1).
# Levanta SOLO las bases (una por microservicio). Los microservicios se corren
# localmente desde el IDE (Entrega 1: "ejecucion local de los micros, bases con Docker").
# Cada base usa el nombre/usuario/clave/puerto que espera el application.yml de su micro.
# Cuatro son PostgreSQL; eventos es MongoDB.
#
# Uso:  docker compose up -d        (levanta las 5 bases)
#       docker compose down         (las baja)

services:
  usuarios-db:
    image: postgres:16
    container_name: usuarios-db
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios
    ports:
      - "5437:5432"

  # eventos usa MongoDB (base documental) con usuario y contrasena: ver documentacion/05-mongodb-eventos.md
  # Entrega 2: preferencias (F9) y notificaciones (F8) usan este mismo servidor, cada uno con su propia base.
  eventos-db:
    image: mongo:7.0.11
    container_name: eventos-db
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: eventos
    ports:
      - "127.0.0.1:27017:27017"

  ventas-db:
    image: postgres:16
    container_name: ventas-db
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ventas
    ports:
      - "5433:5432"

  lugares-db:
    image: postgres:16
    container_name: lugares-db
    environment:
      POSTGRES_DB: lugares
      POSTGRES_USER: lugares
      POSTGRES_PASSWORD: lugares
    ports:
      - "5435:5432"

  pagos-db:
    image: postgres:16
    container_name: pagos-db
    environment:
      POSTGRES_DB: pagos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
