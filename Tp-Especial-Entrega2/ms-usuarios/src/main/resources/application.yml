server:
  port: 8081

spring:
  application:
    name: usuarios-service
  datasource:
    url: ${USUARIOS_DB_URL:jdbc:postgresql://localhost:5437/usuarios}
    username: ${USUARIOS_DB_USER:usuarios}
    password: ${USUARIOS_DB_PASSWORD:usuarios}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Entrega 2: clave para firmar el JWT. DEBE ser identica a la del api-gateway.
jwt:
  secret: ${JWT_SECRET:clave-super-secreta-ticketya-2026-cambiar-en-produccion-min-32-bytes}
  expiracion-segundos: ${JWT_EXPIRACION_SEG:3600}
