server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La web maneja sus propias rutas (/eventos/1, /entradas...): cualquier ruta que no sea un archivo
    # devuelve index.html y React Router muestra la pantalla que corresponde.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
