<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="s1" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="s2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1d6fb8"/></marker>
  </defs>
  <rect width="1180" height="980" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0B3D66">Flujo de compra — secuencia (compra en 2 pasos: reservar y pagar)</text>
  <line x1="40" y1="54" x2="1140" y2="54" stroke="#0B3D66" stroke-width="2"/>
  <text x="40" y="77" font-size="12.5" fill="#64748b">POST /compras crea la compra PENDIENTE y reserva los lugares (atómico). POST /compras/{id}/pagar cobra. Idempotente en los dos pasos.</text>

  <g font-size="13" font-weight="700">
    <rect x="45" y="90" width="150" height="40" rx="8" fill="#EEF2F6" stroke="#64748b" stroke-width="1.8"/><text x="120" y="115" text-anchor="middle" fill="#334155">Cliente</text>
    <line x1="120" y1="130" x2="120" y2="920" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4"/>
    <rect x="300" y="90" width="150" height="40" rx="8" fill="#DCEBFA" stroke="#1d6fb8" stroke-width="1.8"/><text x="375" y="115" text-anchor="middle" fill="#0B3D66">API Gateway</text>
    <line x1="375" y1="130" x2="375" y2="920" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4"/>
    <rect x="545" y="90" width="170" height="40" rx="8" fill="#EAF2FB" stroke="#1d6fb8" stroke-width="2.2"/><text x="630" y="115" text-anchor="middle" fill="#0B3D66">ventas-service</text>
    <line x1="630" y1="130" x2="630" y2="920" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4"/>
    <rect x="850" y="90" width="170" height="40" rx="8" fill="#FFF4EA" stroke="#b4530a" stroke-width="1.8"/><text x="935" y="115" text-anchor="middle" fill="#8a4208">pagos-service</text>
    <line x1="935" y1="130" x2="935" y2="920" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4"/>
  </g>

  <g font-size="12.5">
    <text x="40" y="158" font-size="13.5" font-weight="700" fill="#1d6fb8">① CREAR COMPRA (reserva por 10 min)</text>
    <line x1="120" y1="176" x2="373" y2="176" stroke="#334155" stroke-width="1.8" marker-end="url(#s1)"/>
    <text x="126" y="170" fill="#1e293b">POST /compras  (Idempotency-Key)  items de varios sectores</text>
    <line x1="375" y1="201" x2="628" y2="201" stroke="#334155" stroke-width="1.8" marker-end="url(#s1)"/>
    <text x="383" y="195" fill="#1e293b">crearCompra(cliente, evento, items)</text>

    <rect x="90" y="214" width="960" height="42" rx="6" fill="none" stroke="#7c5cbf" stroke-width="1.3"/>
    <rect x="90" y="214" width="235" height="19" fill="#7c5cbf"/><text x="99" y="228" fill="#fff" font-size="11" font-weight="700">alt [reintento: clave ya usada]</text>
    <line x1="628" y1="248" x2="122" y2="248" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="250" y="242" fill="#7c5cbf">201 { compra existente } — idempotente, no reserva de nuevo</text>

    <rect x="636" y="266" width="340" height="52" rx="6" fill="#FEF9E7" stroke="#caa43a" stroke-width="1.3"/>
    <text x="646" y="284" fill="#7a6212" font-size="11.5">valida límite por cliente; crea compra PENDIENTE</text>
    <text x="646" y="300" fill="#7a6212" font-size="11.5">(vence_en +10min) + un detalle_compra por lugar</text>
    <text x="646" y="314" fill="#7a6212" font-size="11.5" font-weight="700">reserva: asiento LIBRE→RESERVADO / cupo ocupados+= (UPDATE condicional)</text>

    <rect x="90" y="328" width="960" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="1.3"/>
    <rect x="90" y="328" width="215" height="19" fill="#c2410c"/><text x="99" y="342" fill="#fff" font-size="11" font-weight="700">alt [algún lugar ya no libre]</text>
    <line x1="628" y1="362" x2="122" y2="362" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="250" y="356" fill="#c2410c">rollback de toda la compra → 409</text>

    <line x1="628" y1="392" x2="122" y2="392" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="126" y="386" fill="#1d6fb8">201 { compraId, estado PENDIENTE, vence_en }</text>

    <text x="40" y="424" font-size="13.5" font-weight="700" fill="#1d6fb8">② PAGAR</text>
    <line x1="120" y1="442" x2="373" y2="442" stroke="#334155" stroke-width="1.8" marker-end="url(#s1)"/>
    <text x="126" y="436" fill="#1e293b">POST /compras/{id}/pagar  (Idempotency-Key)</text>
    <line x1="375" y1="467" x2="628" y2="467" stroke="#334155" stroke-width="1.8" marker-end="url(#s1)"/>
    <text x="383" y="461" fill="#1e293b">pagar(compraId, medioPago)</text>

    <rect x="90" y="480" width="960" height="40" rx="6" fill="none" stroke="#7c5cbf" stroke-width="1.3"/>
    <rect x="90" y="480" width="200" height="19" fill="#7c5cbf"/><text x="99" y="494" fill="#fff" font-size="11" font-weight="700">alt [compra ya PAGADA]</text>
    <line x1="628" y1="512" x2="122" y2="512" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="250" y="506" fill="#7c5cbf">200 { misma respuesta } — no vuelve a cobrar</text>

    <rect x="636" y="528" width="360" height="36" rx="6" fill="#FEF9E7" stroke="#caa43a" stroke-width="1.3"/>
    <text x="646" y="544" fill="#7a6212" font-size="11.5">valida PENDIENTE y no vencida; ¿ya hay pago</text>
    <text x="646" y="559" fill="#7a6212" font-size="11.5" font-weight="700">APROBADO para esta compra? (si sí, no re-cobra)</text>
    <line x1="630" y1="586" x2="933" y2="586" stroke="#334155" stroke-width="1.8" marker-end="url(#s1)"/>
    <text x="645" y="580" fill="#1e293b">cobrar(compra_id, monto)   [pago.compra_id UNIQUE]</text>

    <rect x="90" y="600" width="960" height="92" rx="6" fill="none" stroke="#1f8a54" stroke-width="1.4"/>
    <rect x="90" y="600" width="150" height="19" fill="#1f8a54"/><text x="99" y="614" fill="#fff" font-size="11" font-weight="700">alt [pago APROBADO]</text>
    <line x1="933" y1="632" x2="632" y2="632" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/><text x="700" y="626" fill="#1d6fb8">aprobado</text>
    <rect x="636" y="639" width="360" height="20" rx="6" fill="#E7EFE9" stroke="#1f8a54" stroke-width="1.2"/>
    <text x="646" y="653" fill="#1f6b43" font-size="11.5">asientos→VENDIDO · compra→PAGADA · cada detalle recibe codigo_qr</text>
    <line x1="628" y1="678" x2="122" y2="678" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="250" y="672" fill="#1d6fb8">200 { entradas con QR }</text>

    <rect x="90" y="706" width="960" height="78" rx="6" fill="none" stroke="#b4530a" stroke-width="1.4"/>
    <rect x="90" y="706" width="155" height="19" fill="#b4530a"/><text x="99" y="720" fill="#fff" font-size="11" font-weight="700">alt [pago RECHAZADO]</text>
    <line x1="933" y1="738" x2="632" y2="738" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/><text x="700" y="732" fill="#1d6fb8">rechazado</text>
    <rect x="636" y="745" width="330" height="20" rx="6" fill="#FFF4EA" stroke="#b4530a" stroke-width="1.2"/>
    <text x="646" y="759" fill="#8a4208" font-size="11.5">libera los lugares · compra→RECHAZADA</text>
    <line x1="628" y1="779" x2="122" y2="779" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#s2)"/>
    <text x="250" y="773" fill="#1d6fb8">402 PAGO_RECHAZADO</text>
  </g>

  <rect x="90" y="812" width="960" height="66" rx="8" fill="#FBF3F3" stroke="#c2410c" stroke-width="1.4"/>
  <text x="104" y="834" font-size="13" font-weight="700" fill="#c2410c">Rama: reserva vencida</text>
  <text x="104" y="854" font-size="12" fill="#7c2d12">Una tarea programada pasa a VENCIDA las compras PENDIENTES cuyo vence_en ya pasó y libera sus lugares.</text>
  <text x="104" y="871" font-size="12" fill="#7c2d12">Si el cliente intenta pagar una compra vencida, recibe 409.</text>

  <text x="40" y="912" font-size="11.5" fill="#64748b" font-style="italic">Ninguna transacción abarca ventas y pagos a la vez: la consistencia se sostiene con compensaciones → consistencia eventual (Entrega 2).</text>
</svg>
