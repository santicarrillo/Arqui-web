<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="e1" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="e2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#b4530a"/></marker>
  </defs>
  <rect width="1300" height="980" fill="#ffffff"/>
  <text x="40" y="44" font-size="25" font-weight="700" fill="#0B3D66">TicketYa — Modelo de datos (una base por servicio)</text>
  <line x1="40" y1="56" x2="1260" y2="56" stroke="#0B3D66" stroke-width="2"/>
  <text x="40" y="80" font-size="13.5" fill="#64748b">Líneas llenas = relación dentro de la misma base (FK real). Líneas punteadas naranjas = referencia por id entre bases (NO hay FK entre bases).</text>

  <!-- ================= eventos_db ================= -->
  <rect x="35" y="100" width="610" height="370" rx="12" fill="#F7FAFD" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="55" y="124" font-size="15" font-weight="700" fill="#1d6fb8">eventos_db</text>

  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="60" y="140" width="210" height="96" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="60" y="140" width="210" height="24" rx="7" fill="#0B3D66"/>
    <text x="165" y="157" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Organizador</text>
    <text x="72" y="182" fill="#1e293b">id «PK»</text>
    <text x="72" y="202" fill="#1e293b">nombre</text>
    <text x="72" y="222" fill="#1e293b">email</text>

    <rect x="360" y="135" width="255" height="176" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="360" y="135" width="255" height="24" rx="7" fill="#0B3D66"/>
    <text x="487" y="152" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Evento</text>
    <text x="372" y="177" fill="#1e293b">id «PK»</text>
    <text x="372" y="196" fill="#1e293b">nombre, tipo, estado</text>
    <text x="372" y="215" fill="#1e293b">fechaHora</text>
    <text x="372" y="234" fill="#8a4208">organizadorId (FK)</text>
    <text x="372" y="253" fill="#b4530a">lugarId (ref)</text>
    <text x="372" y="272" fill="#1e293b">limitePorCliente</text>

    <rect x="60" y="300" width="210" height="96" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="60" y="300" width="210" height="24" rx="7" fill="#0B3D66"/>
    <text x="165" y="317" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Participante</text>
    <text x="72" y="342" fill="#1e293b">id «PK»</text>
    <text x="72" y="362" fill="#8a4208">eventoId (FK)</text>
    <text x="72" y="382" fill="#1e293b">nombre</text>

    <rect x="360" y="345" width="255" height="96" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="360" y="345" width="255" height="24" rx="7" fill="#0B3D66"/>
    <text x="487" y="362" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">TarifaSector</text>
    <text x="372" y="387" fill="#8a4208">eventoId (FK)</text>
    <text x="372" y="406" fill="#b4530a">sectorId (ref)</text>
    <text x="372" y="425" fill="#1e293b">precio</text>
  </g>
  <!-- relaciones internas eventos -->
  <line x1="270" y1="188" x2="360" y2="200" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="300" y="183" font-size="11" fill="#334155">1..*</text>
  <line x1="420" y1="311" x2="200" y2="300" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="300" y="300" font-size="11" fill="#334155">1..*</text>
  <line x1="487" y1="311" x2="487" y2="345" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="495" y="332" font-size="11" fill="#334155">1..*</text>

  <!-- ================= lugares_db ================= -->
  <rect x="665" y="100" width="595" height="370" rx="12" fill="#F7FAFD" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="685" y="124" font-size="15" font-weight="700" fill="#1d6fb8">lugares_db</text>
  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="690" y="150" width="220" height="116" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="690" y="150" width="220" height="24" rx="7" fill="#0B3D66"/>
    <text x="800" y="167" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Lugar</text>
    <text x="702" y="192" fill="#1e293b">id «PK»</text>
    <text x="702" y="212" fill="#1e293b">nombre, direccion</text>
    <text x="702" y="232" fill="#1e293b">latitud, longitud</text>
    <text x="702" y="252" fill="#1e293b">ciudad</text>

    <rect x="1000" y="150" width="235" height="150" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="1000" y="150" width="235" height="24" rx="7" fill="#0B3D66"/>
    <text x="1117" y="167" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Sector</text>
    <text x="1012" y="192" fill="#1e293b">id «PK»</text>
    <text x="1012" y="211" fill="#8a4208">lugarId (FK)</text>
    <text x="1012" y="230" fill="#1e293b">nombre</text>
    <text x="1012" y="249" fill="#1e293b">tipo {NUM, NO_NUM}</text>
    <text x="1012" y="268" fill="#1e293b">capacidad</text>

    <rect x="1000" y="330" width="235" height="106" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="1000" y="330" width="235" height="24" rx="7" fill="#0B3D66"/>
    <text x="1117" y="347" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Asiento</text>
    <text x="1012" y="372" fill="#1e293b">id «PK»</text>
    <text x="1012" y="391" fill="#8a4208">sectorId (FK)</text>
    <text x="1012" y="410" fill="#1e293b">fila, numero</text>
  </g>
  <line x1="910" y1="208" x2="1000" y2="210" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="940" y="203" font-size="11" fill="#334155">1..*</text>
  <line x1="1117" y1="300" x2="1117" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="1125" y="320" font-size="11" fill="#334155">1..* (numerado)</text>

  <!-- ================= ventas_db ================= -->
  <rect x="35" y="510" width="780" height="430" rx="12" fill="#EFF6FD" stroke="#1d6fb8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="55" y="534" font-size="15" font-weight="700" fill="#1d6fb8">ventas_db — corazón del core</text>
  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="60" y="552" width="250" height="140" rx="7" fill="#fff" stroke="#1d6fb8" stroke-width="1.8"/>
    <rect x="60" y="552" width="250" height="24" rx="7" fill="#1d6fb8"/>
    <text x="185" y="569" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Disponibilidad</text>
    <text x="72" y="594" fill="#1e293b">id «PK»</text>
    <text x="72" y="613" fill="#b4530a">eventoId (ref)</text>
    <text x="72" y="632" fill="#b4530a">sectorId (ref)</text>
    <text x="72" y="651" fill="#1e293b">capacidad</text>
    <text x="72" y="670" fill="#1e293b">vendidas, reservadas</text>
    <text x="72" y="686" fill="#64748b" font-size="10.5" font-family="Segoe UI">fila "caliente": 1 por (evento,sector)</text>

    <rect x="360" y="552" width="250" height="158" rx="7" fill="#fff" stroke="#1d6fb8" stroke-width="1.8"/>
    <rect x="360" y="552" width="250" height="24" rx="7" fill="#1d6fb8"/>
    <text x="485" y="569" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Reserva</text>
    <text x="372" y="594" fill="#1e293b">id «PK»</text>
    <text x="372" y="613" fill="#b4530a">eventoId (ref)</text>
    <text x="372" y="632" fill="#b4530a">sectorId (ref)</text>
    <text x="372" y="651" fill="#b4530a">clienteId (ref)</text>
    <text x="372" y="670" fill="#1e293b">cantidad</text>
    <text x="372" y="689" fill="#1e293b">estado, venceEn</text>

    <rect x="360" y="745" width="430" height="176" rx="7" fill="#fff" stroke="#1d6fb8" stroke-width="1.8"/>
    <rect x="360" y="745" width="430" height="24" rx="7" fill="#1d6fb8"/>
    <text x="575" y="762" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Entrada</text>
    <text x="372" y="787" fill="#1e293b">id «PK»</text>
    <text x="372" y="806" fill="#8a4208">reservaId (FK)</text>
    <text x="372" y="825" fill="#b4530a">eventoId, sectorId, clienteId (ref)</text>
    <text x="372" y="844" fill="#b4530a">asientoId (ref, si numerado)</text>
    <text x="372" y="863" fill="#1e293b">precio, medioPago, fechaCompra</text>
    <text x="372" y="882" fill="#1e293b">codigoQR (único)</text>
    <text x="372" y="901" fill="#1e293b">estado {EMITIDA, UTILIZADA, DEVUELTA, A_REINTEGRAR}</text>
  </g>
  <line x1="485" y1="710" x2="485" y2="745" stroke="#334155" stroke-width="1.8" marker-end="url(#e1)"/>
  <text x="493" y="732" font-size="11" fill="#334155">1..*</text>

  <!-- ================= clientes_db ================= -->
  <rect x="840" y="510" width="420" height="150" rx="12" fill="#F7FAFD" stroke="#1d6fb8" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="860" y="534" font-size="15" font-weight="700" fill="#1d6fb8">clientes_db</text>
  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="865" y="548" width="360" height="96" rx="7" fill="#fff" stroke="#0B3D66" stroke-width="1.6"/>
    <rect x="865" y="548" width="360" height="24" rx="7" fill="#0B3D66"/>
    <text x="1045" y="565" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Cliente</text>
    <text x="877" y="590" fill="#1e293b">id «PK»</text>
    <text x="877" y="609" fill="#1e293b">nombre, apellido</text>
    <text x="877" y="628" fill="#1e293b">email, ciudad</text>
  </g>

  <!-- ================= pagos_db ================= -->
  <rect x="840" y="690" width="420" height="150" rx="12" fill="#FFF8F1" stroke="#b4530a" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="860" y="714" font-size="15" font-weight="700" fill="#b4530a">pagos_db (mock)</text>
  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="865" y="728" width="360" height="96" rx="7" fill="#fff" stroke="#b4530a" stroke-width="1.6"/>
    <rect x="865" y="728" width="360" height="24" rx="7" fill="#b4530a"/>
    <text x="1045" y="745" text-anchor="middle" fill="#fff" font-weight="700" font-family="Segoe UI">Pago</text>
    <text x="877" y="770" fill="#1e293b">id «PK»</text>
    <text x="877" y="789" fill="#b4530a">clienteId (ref)</text>
    <text x="877" y="808" fill="#1e293b">monto, estado, fecha</text>
  </g>

  <!-- refs cruzadas (por id, sin FK) -->
  <path d="M615 230 C 650 230, 655 205, 690 205" fill="none" stroke="#b4530a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#e2)"/>
  <text x="620" y="222" font-size="10.5" fill="#b4530a">lugarId</text>
  <path d="M310 600 C 335 590, 150 500, 300 470" fill="none" stroke="#b4530a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#e2)"/>
  <path d="M610 640 C 760 640, 770 300, 1000 240" fill="none" stroke="#b4530a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#e2)"/>
  <path d="M790 820 C 830 700, 835 620, 865 600" fill="none" stroke="#b4530a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#e2)"/>
  <text x="640" y="560" font-size="10.5" fill="#b4530a">sectorId →</text>
  <text x="690" y="835" font-size="10.5" fill="#b4530a">clienteId →</text>

  <text x="40" y="965" font-size="12" fill="#64748b" font-style="italic">Entidades solapadas: Evento, Sector, Cliente y Lugar son dueñas de un servicio y se referencian por id (a veces con un dato denormalizado, p. ej. capacidad y fechaHora) en ventas_db y eventos_db.</text>
</svg>
