<rect x="390" y="420" width="300" height="112" rx="7" fill="#fff" stroke="#1d6fb8" stroke-width="1.7"/><rect x="390" y="420" width="300" height="26" rx="7" fill="#1d6fb8"/><text x="540" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, Arial">cupo_sector</text><text x="401" y="463" font-size="11.5" font-family="Consolas, monospace" fill="#b4530a">evento_id (*) «PK»</text><text x="401" y="482" font-size="11.5" font-family="Consolas, monospace" fill="#b4530a">sector_id (*) «PK»</text><text x="401" y="500" font-size="11.5" font-family="Consolas, monospace" fill="#b4530a">capacidad (copia)</text><text x="401" y="518" font-size="11.5" font-family="Consolas, monospace" fill="#1f8a54">ocupados   [0..capacidad]</text>
