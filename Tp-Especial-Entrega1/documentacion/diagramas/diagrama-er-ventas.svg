<rect width="1360" height="680" fill="#fff"/>
<text x="30" y="40" font-size="23" font-weight="700" fill="#0B3D66">Modelo de datos (2/2) — ventas (el core) y pagos</text>
<line x1="30" y1="52" x2="1330" y2="52" stroke="#0B3D66" stroke-width="2"/>
<text x="30" y="74" font-size="12.5" fill="#64748b">compra hace de reserva (PENDIENTE) y de venta (PAGADA); cada detalle_compra es una entrada. evento_asiento (numerados) + cupo_sector (zonas) frenan la doble venta.</text>
<rect x="30" y="90" width="990" height="575" rx="12" fill="#F7FAFD" stroke="#1d6fb8" stroke-width="1.5" stroke-dasharray="3,3"/><text x="50" y="114" font-size="15" font-weight="700" fill="#1d6fb8" font-family="Segoe UI, Arial">ventas_db</text>
