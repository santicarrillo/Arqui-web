<text x="30" y="672" font-size="12" fill="#64748b" font-style="italic">pago.compra_id es UNIQUE: un solo cobro por compra (evita doble cargo si ventas se cae entre el cobro y marcar PAGADA). Cada devolución aprobada genera un reintegro.</text>
